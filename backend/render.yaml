services:
  - type: web
    name: smart-city-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BACKEND_CORS_ORIGINS
        value: http://localhost:8501,http://127.0.0.1:8501
      - key: TOMTOM_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_PRIME_PLAN_ID
        sync: false
      - key: RAZORPAY_PRIME_TOTAL_COUNT
        value: "12"
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: AUTH_TOKEN_TTL_SECONDS
        value: "86400"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "15"
